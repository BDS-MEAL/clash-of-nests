<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash Of Nests</title>
<style>
  body{margin:0;width:100vw;height:100vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;text-align:center}
  h1{font-size:2.5rem;margin-bottom:10px}
  p{font-size:1.2rem;opacity:.9;margin-bottom:20px}
  button{background:#fff;color:#764ba2;border:none;padding:12px 30px;font-size:1rem;
  font-weight:bold;border-radius:25px}
</style>
</head>
<body>
  <h1>Connection Lost</h1>
  <p>Clash Of Nests requires an active internet connection.</p>
  <button onclick="retry()">Retry</button>
  <script>
    function retry(){ window.location.href = "https://lingo-quiets.streamlit.app/"; }
    window.addEventListener('online', retry);
  </script>
</body>
</html>
